databases:
  - name: roost-assured-db
    plan: basic-256mb
    region: ohio
    databaseName: roost_assured_production
    user: roost_assured

services:
  - type: web
    name: roost-assured-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: ohio
    healthCheckPath: /up
    disk:
      name: roost-assured-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: roost-assured-db
          property: connectionString
      - key: RAILS_MAX_THREADS
        value: 5
      - key: WEB_CONCURRENCY
        value: 1
      - key: APP_HOST
        value: roostassured.com
      - key: STORAGE_DISK_PATH
        value: /var/data/storage
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAILER_FROM
        value: "Roost Assured <hello@roostassured.com>"

  - type: worker
    name: roost-assured-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bin/rails solid_queue:start
    plan: starter
    region: ohio
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: roost-assured-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAILER_FROM
        value: "Roost Assured <hello@roostassured.com>"
      - key: APP_HOST
        value: roostassured.com
