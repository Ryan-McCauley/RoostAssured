databases:
  - name: roost-assured-db
    plan: basic-256mb
    region: ohio
    databaseName: roost_assured_production
    user: roost_assured

services:
  - type: web
    name: roost-assured-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: ohio
    healthCheckPath: /up
    # A Render disk attaches to exactly one service, so this volume belongs to the web service
    # alone. That means the web service cannot scale past a single instance, and the worker below
    # cannot read or write attachments. See "Known limitations" in the README; moving Active
    # Storage to S3 removes both constraints.
    disk:
      name: roost-assured-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: roost-assured-db
          property: connectionString
      - key: RAILS_MAX_THREADS
        value: 5
      - key: WEB_CONCURRENCY
        value: 1
      - key: APP_HOST
        value: roostassured.com
      - key: STORAGE_DISK_PATH
        value: /var/data/storage
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAILER_FROM
        value: "Roost Assured <hello@roostassured.com>"
      - key: CHECKR_API_KEY
        sync: false
      - key: CHECKR_WEBHOOK_KEY
        sync: false
      - key: CHECKR_PACKAGE
        sync: false
      # Nominatim's usage policy requires a contact address on every request.
      - key: GEOCODER_CONTACT_EMAIL
        sync: false
      # Optional. Without it, IP geolocation for the admin heatmap is simply off: ip-api's free
      # tier has no HTTPS endpoint, and visitor IPs are not worth sending in the clear.
      - key: IP_API_KEY
        sync: false

  - type: worker
    name: roost-assured-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bin/rails solid_queue:start
    plan: starter
    region: ohio
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: roost-assured-db
          property: connectionString
      - key: APP_HOST
        value: roostassured.com
      # Set so the worker boots with the same Active Storage configuration as the web service.
      # It cannot reach that disk (see above), so jobs here must not touch attachments.
      - key: STORAGE_DISK_PATH
        value: /var/data/storage
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAILER_FROM
        value: "Roost Assured <hello@roostassured.com>"
      # GeocodeUserJob and NotifyNearbySittersJob run here, so the worker needs the geocoder
      # contact address the web service uses.
      - key: GEOCODER_CONTACT_EMAIL
        sync: false
      - key: IP_API_KEY
        sync: false
